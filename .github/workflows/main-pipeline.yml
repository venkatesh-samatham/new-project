name: DevOps-Project-CI-CD

on:
  push:
    branches: [ "master" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: echo "Tests Passed!"

  build-and-push:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint ./charts/my-app-chart

      - name: Deploy to K8s
        run: |
          echo "Executing: helm upgrade --install my-app ./charts/my-app-chart"
          helm upgrade --install my-app ./charts/my-app-chart
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Helm Lint
        run: helm lint ./charts/my-app-chart

      - name: Deploy to K8s
        run: |
          helm upgrade --install my-app ./charts/my-app-chart